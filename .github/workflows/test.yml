name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main, master]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      # CPU-only torch: enough for the worker round-trip tests, no CUDA needed.
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: ruff check src

      - name: Import layering (no cycles / no upward imports)
        run: lint-imports

      - name: Tests
        run: pytest -m "not gpu and not network and not comfyui" -q
