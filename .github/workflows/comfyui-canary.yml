name: ComfyUI canary

# Weekly check that the surface of ComfyUI comfy-env touches still exists on
# upstream master. Allowed to fail -- never gates anything; a failure opens
# (or comments on) a tracking issue so upstream drift is a notification, not
# a user bug report.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install comfy-env + dev deps
        run: pip install -e ".[dev]"

      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Clone ComfyUI master
        run: git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git /tmp/ComfyUI

      - name: Install ComfyUI requirements
        run: pip install -r /tmp/ComfyUI/requirements.txt

      - name: Run compat canary
        id: canary
        env:
          COMFYUI_DIR: /tmp/ComfyUI
        run: pytest -m comfyui -q

      - name: Open/refresh tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="ComfyUI canary failing: upstream contact surface changed"
          body="The weekly canary against ComfyUI master failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label canary || gh issue create --title "$title" --body "$body"
          fi
