name: CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # PyPI publish is gated on the full test matrix passing.
  test:
    uses: ./.github/workflows/test.yml

  check-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || '' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        if: github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        if: github.event_name == 'push'
        id: version
        run: |
          version=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/' | tr -d '\r')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create tag
        if: github.event_name == 'push'
        run: |
          version="${{ steps.version.outputs.version }}"
          # Check the REMOTE for the tag -- the shallow checkout has no tags,
          # so a local rev-parse always says "missing" and the push then
          # collides with the existing remote tag.
          if [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            git tag "v$version" && git push origin "v$version"
          else
            echo "Tag v$version already exists on origin -- skipping"
          fi

      - name: Build package
        if: github.event_name == 'push'
        run: pip install build && python -m build

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-pushes of an already-published version are green no-ops, not
          # failures (version bumps still publish normally).
          skip-existing: true
