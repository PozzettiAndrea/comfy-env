[project]
name = "comfy-env"
version = "0.4.27"
description = "Environment management for ComfyUI custom nodes - CUDA wheel resolution and process isolation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Andrea Pozzetti"}
]
keywords = ["comfyui", "cuda", "wheels", "environment", "isolation", "venv", "process"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "uv>=0.4.0",
    "pip>=21.0",
    "numpy",
    "pyyaml>=6.0",
    "pre-commit",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
    "import-linter",
    "psutil",
]

[project.urls]
Homepage = "https://github.com/PozzettiAndrea/comfy-env"
Repository = "https://github.com/PozzettiAndrea/comfy-env"
Issues = "https://github.com/PozzettiAndrea/comfy-env/issues"

[project.scripts]
comfy-env = "comfy_env.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_env"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# CI gate is fatal-only for now: syntax errors, bad comparisons, undefined
# names. Widen once the existing style debt is paid down.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU (run via self-hosted dispatch, skipped in hosted CI)",
    "network: touches the network (pixi bootstrap, wheel index)",
    "comfyui: needs a ComfyUI checkout (compat canary)",
]
